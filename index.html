<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python-тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1f2433; --muted:#6b7389; --line:#e3e7f0;
  --blue:#3572c6; --blue2:#e8f0fc; --yellow:#ffd43b; --yellow2:#fff6d1;
  --green:#22a35a; --green2:#e3f6ea; --red:#d64545; --red2:#fde9e9;
  --code:#1e2230; --codeink:#e6e9f2;
  --r:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.55}
button{font-family:inherit;font-size:inherit;cursor:pointer}
code,pre,textarea.ed,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);}
.hwrap{max-width:980px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.logo .snake{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue) 50%,var(--yellow) 50%);display:grid;place-items:center;font-size:18px}
.spacer{flex:1}
.gprog{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:15px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#5bd18b);border-radius:99px;transition:width .4s}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:800;background:var(--blue);color:#fff;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--blue2);color:var(--blue)}
.btn.yellow{background:var(--yellow);color:#4a3b00}
.btn.green{background:var(--green)}
.btn.small{padding:7px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:980px;margin:0 auto;padding:22px 18px 80px}
h1{font-size:30px;font-weight:900;margin:6px 0 4px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;cursor:pointer;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:8px}
.tcard:hover{transform:translateY(-2px);border-color:var(--blue)}
.tcard .top{display:flex;align-items:center;gap:10px}
.tcard .em{font-size:28px;width:48px;height:48px;border-radius:12px;background:var(--blue2);display:grid;place-items:center;flex:none}
.tcard .num{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tcard .tt{font-weight:800;font-size:18px;line-height:1.25}
.tcard .meta{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:700}
.tcard .meta .bar{flex:1}
.tcard.done{border-color:var(--green)}
.howto{background:var(--yellow2);border-radius:var(--r);padding:14px 18px;margin:0 0 22px;font-size:16px}
.howto b{font-weight:800}
.panel{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:22px 24px}
.back{background:none;border:0;color:var(--blue);font-weight:800;padding:0;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin:14px 0 16px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:800;color:var(--muted)}
.tab.on{border-color:var(--blue);color:var(--blue);background:var(--blue2)}
.theory h3{font-size:22px;font-weight:900;margin:26px 0 8px}
.theory h3:first-child{margin-top:0}
.theory p{margin:8px 0}
.theory ul{margin:8px 0;padding-left:22px}
.theory li{margin:4px 0}
code{background:var(--blue2);color:#1d4f94;padding:1px 6px;border-radius:6px;font-size:.88em}
pre{margin:0;white-space:pre-wrap;word-break:break-word}
pre.code{background:var(--code);color:var(--codeink);padding:14px 16px;border-radius:12px;font-size:15px;margin:10px 0;line-height:1.5}
.outblock{background:#fff;border:2px dashed #c9d2e3;border-radius:12px;padding:8px 14px 10px;margin:-2px 0 12px}
.outblock .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.outblock pre{font-family:"JetBrains Mono",monospace;font-size:15px}
.tip{background:var(--yellow2);border-left:5px solid var(--yellow);padding:10px 14px;border-radius:10px;margin:14px 0}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.dot{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--muted);display:grid;place-items:center;padding:0}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.dot.cur{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.dot.done.cur{color:#fff}
.legend{font-size:14px;color:var(--muted);margin:-6px 0 14px}
.kind{display:inline-block;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:8px;margin-bottom:10px}
.kind.quiz{background:#efe6ff;color:#6a3fc2}
.kind.out{background:var(--yellow2);color:#8a6a00}
.kind.code{background:var(--blue2);color:var(--blue)}
.q{font-size:19px;font-weight:700;margin:0 0 12px;white-space:pre-wrap}
.q .mono{font-size:16px;font-weight:600;background:#f1f3f8;border-radius:8px;padding:2px 6px}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
.opt:hover{border-color:#b9c6de}
.opt .l{width:28px;height:28px;border-radius:8px;background:#f1f3f8;display:grid;place-items:center;font-weight:900;flex:none;color:var(--muted)}
.opt.sel{border-color:var(--blue);background:var(--blue2)}
.opt.ok{border-color:var(--green);background:var(--green2)}
.opt.bad{border-color:var(--red);background:var(--red2)}
.inputs{background:#f1f3f8;border-radius:12px;padding:8px 14px;margin:0 0 12px;font-size:15px}
.inputs b{font-weight:800}
.inputs .mono{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:0 3px;font-size:14px}
label.fl{display:block;font-weight:800;font-size:14px;color:var(--muted);margin:10px 0 6px}
textarea.ans{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:"JetBrains Mono",monospace;font-size:16px;resize:vertical}
textarea.ans:focus,textarea.ed:focus{outline:none;border-color:var(--blue)}
textarea.ed{width:100%;min-height:200px;background:var(--code);color:var(--codeink);border:2px solid var(--code);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.55;resize:vertical;tab-size:4;caret-color:var(--yellow)}
.example{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.example>div{background:#f1f3f8;border-radius:12px;padding:8px 12px}
.example .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.example pre{font-family:"JetBrains Mono",monospace;font-size:14.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--green2);border:2px solid #a8e0bf}
.fb.bad{background:var(--red2);border:2px solid #f2b8b8}
.fb.info{background:#f1f3f8;border:2px solid var(--line)}
.fb h4{margin:0 0 4px;font-size:18px;font-weight:900}
.fb pre{background:#fff;border-radius:8px;padding:8px 10px;font-family:"JetBrains Mono",monospace;font-size:14px;margin:6px 0}
.fb .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}
.navrow{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
.status{font-size:14px;color:var(--muted);font-weight:700}
.hint{background:var(--yellow2);border-radius:12px;padding:10px 14px;margin-top:12px;display:none}
.hint.show{display:block}
.sol{margin-top:12px;display:none}
.sol.show{display:block}
.sbx-out{background:var(--code);color:var(--codeink);border-radius:12px;padding:12px 14px;min-height:80px;font-family:"JetBrains Mono",monospace;font-size:15px;white-space:pre-wrap;margin-top:8px}
.sbx-out .err{color:#ff9a9a}
.foot{margin-top:28px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.confetti{position:fixed;pointer-events:none;top:0;left:0;width:100%;height:100%;z-index:50}
.donebanner{background:var(--green2);border:2px solid #a8e0bf;border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-weight:800}
@media (max-width:640px){
  .hwrap{padding:8px 12px;gap:8px} .gprog .bar{display:none} .logo span.t{display:none}
  main{padding:16px 12px 70px} .panel{padding:16px 14px} h1{font-size:25px}
  .example,.fb .cols{grid-template-columns:1fr}
  .dot{width:32px;height:32px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo" id="home"><div class="snake">🐍</div><span class="t">Python-тренажёр</span></div>
  <div class="spacer"></div>
  <div class="gprog"><span id="gcount">0</span><div class="bar" style="width:110px"><i id="gbar" style="width:0"></i></div></div>
  <button class="btn small yellow" id="sbxBtn">🧪 Песочница</button>
</div></header>
<main id="app"></main>
<canvas class="confetti" id="conf"></canvas>

<script>
const DATA = [{"id": "print", "emoji": "🖨️", "title": "Вывод на экран: print()", "theory": "<h3>Что такое программа<\/h3>\n<p>Программа — это список команд для компьютера. Компьютер выполняет их <b>строго по порядку, сверху вниз<\/b>, и делает ровно то, что написано. Не больше и не меньше. Он не догадывается, что ты «имел в виду».<\/p>\n<h3>Команда print<\/h3>\n<p><code>print<\/code> по-английски — «печатать». Что положишь в скобки, то и появится на экране.<\/p>\n<pre class=\"code\">print(\"Привет!\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>Привет!<\/pre><\/div>\n<p>Текст всегда пишем <b>в кавычках<\/b>: <code>\"так\"<\/code> или <code>'так'<\/code>. Кавычки говорят Python: «это просто текст, не пытайся его понять».<\/p>\n<h3>Числа и вычисления<\/h3>\n<p>Числа можно писать без кавычек. Python сам посчитает пример:<\/p>\n<pre class=\"code\">print(5)\nprint(2 + 3)\nprint(\"2 + 3\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>5\n5\n2 + 3<\/pre><\/div>\n<p>Видишь разницу? В третьей строке <code>2 + 3<\/code> в кавычках — значит это просто текст, и Python его не считает.<\/p>\n<h3>Несколько значений через запятую<\/h3>\n<p>В один <code>print<\/code> можно положить несколько вещей через запятую. Python сам поставит между ними пробел.<\/p>\n<pre class=\"code\">print(\"Мне\", 13, \"лет\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>Мне 13 лет<\/pre><\/div>\n<h3>Каждый print — с новой строки<\/h3>\n<pre class=\"code\">print(\"Раз\")\nprint(\"Два\")\nprint()\nprint(\"Три\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>Раз\nДва\n\nТри<\/pre><\/div>\n<p>Пустой <code>print()<\/code> печатает пустую строку.<\/p>\n<h3>Для любопытных: sep и end<\/h3>\n<p>После того как <code>print<\/code> напечатал текст, он <b>сам нажимает невидимый Enter<\/b> — переходит на новую строку. Поэтому следующий <code>print<\/code> начинает с новой строки.<\/p>\n<p><code>end<\/code> — это «чем закончить». Обычно там стоит этот невидимый Enter. Если написать <code>end=\"!\"<\/code>, то в конце вместо Enter будет восклицательный знак, и следующий <code>print<\/code> продолжит <b>на той же строке<\/b>:<\/p>\n<pre class=\"code\">print(\"Привет\", end=\"!\")\nprint(\"Пока\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>Привет!Пока<\/pre><\/div>\n<p>А <code>sep<\/code> — это что ставить <b>между<\/b> значениями (обычно пробел):<\/p>\n<pre class=\"code\">print(1, 2, 3, sep=\"-\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>1-2-3<\/pre><\/div>\n<div class=\"tip\">💡 Запятые внутри скобок print только разделяют значения. На экран они не попадают — так же как кавычки.<\/div>\n<div class=\"tip\">💡 Частые ошибки: забыть закрыть кавычку или скобку; написать <code>Print<\/code> с большой буквы. Python различает большие и маленькие буквы, поэтому <code>Print<\/code> и <code>print<\/code> для него — разные слова.<\/div>", "tasks": [{"t": "quiz", "q": "Какая команда выводит текст на экран?", "opts": ["print", "write", "show", "say"], "a": 0, "why": "print — «печатать». Остальных команд в Python нет.", "id": "print-1"}, {"t": "quiz", "q": "Как правильно вывести слово Кот?", "opts": ["print(Кот)", "print(\"Кот\")", "print \"Кот\"", "Print(\"Кот\")"], "a": 1, "why": "Текст — в кавычках, кавычки — внутри скобок, print — маленькими буквами.", "id": "print-2"}, {"t": "quiz", "q": "Что выведет print(\"5 + 5\")?", "opts": ["10", "5 + 5", "\"5 + 5\"", "Ошибку"], "a": 1, "why": "В кавычках — это просто текст. Python печатает его как есть, без кавычек.", "id": "print-3"}, {"t": "quiz", "q": "Что выведет print(5 + 5)?", "opts": ["10", "5 + 5", "55", "Ошибку"], "a": 0, "why": "Без кавычек Python считает пример.", "id": "print-4"}, {"t": "quiz", "q": "Сколько строк появится на экране?\nprint(\"a\")\nprint()\nprint(\"b\")", "opts": ["1", "2", "3", "0"], "a": 2, "why": "a, потом пустая строка, потом b — всего три строки.", "id": "print-5"}, {"t": "quiz", "q": "Почему Print(\"Привет\") выдаст ошибку?", "opts": ["Python различает большие и маленькие буквы, команда называется print", "Нужны одинарные кавычки", "Слово «Привет» писать нельзя", "Ошибки не будет"], "a": 0, "why": "", "id": "print-6"}, {"t": "out", "q": "Что выведет программа?", "code": "print(\"Я учу Python\")", "inputs": [], "why": "", "id": "print-7", "a": "Я учу Python"}, {"t": "out", "q": "Что выведет программа?", "code": "print(7 * 3)", "inputs": [], "why": "Звёздочка * — это умножение.", "id": "print-8", "a": "21"}, {"t": "out", "q": "Что выведет программа?", "code": "print(\"Мне\", 13, \"лет\")", "inputs": [], "why": "Между значениями через запятую Python ставит пробел.", "id": "print-9", "a": "Мне 13 лет"}, {"t": "out", "q": "Что выведет программа?", "code": "print(\"Раз\")\nprint(\"Два\")\nprint(\"Три\")", "inputs": [], "why": "", "id": "print-10", "a": "Раз\nДва\nТри"}, {"t": "out", "q": "Что выведет программа?", "code": "print(\"2 * 3 =\", 2 * 3)", "inputs": [], "why": "Первое — текст в кавычках (печатается как есть), второе — пример (считается).", "id": "print-11", "a": "2 * 3 = 6"}, {"t": "out", "q": "Что выведет программа?", "code": "print(\"A\", \"B\", \"C\", sep=\"-\")", "inputs": [], "why": "sep задаёт, что ставить между значениями.", "id": "print-12", "a": "A-B-C"}, {"t": "out", "q": "Что выведет программа?", "code": "print(\"Привет\", end=\"!\")\nprint(\"Пока\")", "inputs": [], "why": "Обычно print в конце сам «нажимает Enter». А end=\"!\" говорит: в конце поставь «!» вместо Enter. Поэтому второй print пишет «Пока» прямо за «!» на той же строке. Запятая внутри скобок на экран не попадает.", "id": "print-13", "a": "Привет!Пока"}, {"t": "out", "q": "Что выведет программа?", "code": "print(10 - 4, 10 + 4)", "inputs": [], "why": "", "id": "print-14", "a": "6 14"}, {"t": "code", "q": "Выведи на экран фразу: Привет, мир!", "sol": "print(\"Привет, мир!\")", "tests": [[]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "print-15", "exp": ["Привет, мир!"]}, {"t": "code", "q": "Выведи три строки, каждое слово на своей строке: Кошка, Собака, Попугай.", "sol": "print(\"Кошка\")\nprint(\"Собака\")\nprint(\"Попугай\")", "tests": [[]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "print-16", "exp": ["Кошка\nСобака\nПопугай"]}, {"t": "code", "q": "Выведи результат сложения 125 + 378. Не считай сам — пусть посчитает Python!", "sol": "print(125 + 378)", "tests": [[]], "start": "", "hint": "Пример внутри print() пиши без кавычек.", "need": [["125\\s*\\+\\s*378", "Пусть Python сам посчитает: напиши в print пример 125 + 378"]], "ban": [], "hide": true, "id": "print-17", "exp": ["503"]}, {"t": "code", "q": "Нарисуй ёлочку из звёздочек (перед звёздочками стоят пробелы):\n  *\n ***\n*****", "sol": "print(\"  *\")\nprint(\" ***\")\nprint(\"*****\")", "tests": [[]], "start": "", "hint": "Пробелы тоже пиши внутри кавычек.", "need": [], "ban": [], "hide": false, "id": "print-18", "exp": ["  *\n ***\n*****"]}, {"t": "code", "q": "Одним print выведи в одну строку числа 1 2 3 (три значения через запятую).", "sol": "print(1, 2, 3)", "tests": [[]], "start": "", "hint": "", "need": [[",", "Положи три числа в один print через запятую"]], "ban": [], "hide": false, "id": "print-19", "exp": ["1 2 3"]}, {"t": "code", "q": "Выведи дату 10.11.2026, передав в print три числа 10, 11, 2026 и используя sep.", "sol": "print(10, 11, 2026, sep=\".\")", "tests": [[]], "start": "", "hint": "", "need": [["sep", "Используй sep"]], "ban": [], "hide": false, "id": "print-20", "exp": ["10.11.2026"]}, {"t": "code", "q": "Выведи строку «6 * 7 = 42», где 42 посчитает сам Python.", "sol": "print(\"6 * 7 =\", 6 * 7)", "tests": [[]], "start": "", "hint": "Сначала текст в кавычках \"6 * 7 =\", потом через запятую пример без кавычек.", "need": [["6\\s*\\*\\s*7\\s*\\)", "Число 42 должен посчитать Python: напиши пример 6 * 7 без кавычек"]], "ban": [], "hide": false, "id": "print-21", "exp": ["6 * 7 = 42"]}, {"t": "code", "q": "Нарисуй квадрат 3 на 3 из символов #.", "sol": "print(\"###\")\nprint(\"###\")\nprint(\"###\")", "tests": [[]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "print-22", "exp": ["###\n###\n###"]}, {"t": "code", "q": "Выведи слово Начало, потом пустую строку, потом слово Конец.", "sol": "print(\"Начало\")\nprint()\nprint(\"Конец\")", "tests": [[]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "print-23", "exp": ["Начало\n\nКонец"]}]}, {"id": "vars", "emoji": "📦", "title": "Переменные и типы данных", "theory": "<h3>Переменная — это коробка с наклейкой<\/h3>\n<p>Представь коробку, на которой написано имя, например <code>age<\/code>. В коробку можно положить значение, а потом достать его по имени.<\/p>\n<pre class=\"code\">age = 13\nprint(age)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>13<\/pre><\/div>\n<p>Знак <code>=<\/code> в программировании — это <b>не «равно»<\/b>, а команда «положи в коробку». Читаем так: «положи 13 в коробку age».<\/p>\n<h3>Значение можно менять<\/h3>\n<p>В коробке лежит только одна вещь. Новое значение выкидывает старое:<\/p>\n<pre class=\"code\">x = 5\nx = 10\nprint(x)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>10<\/pre><\/div>\n<p>Можно взять старое значение, что-то с ним сделать и положить обратно:<\/p>\n<pre class=\"code\">score = 0\nscore = score + 10\nprint(score)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>10<\/pre><\/div>\n<p>Справа считается <code>score + 10<\/code> = 0 + 10 = 10, и результат кладётся в <code>score<\/code>.<\/p>\n<h3>Как называть переменные<\/h3>\n<ul><li>Только латинские буквы, цифры и знак <code>_<\/code>: <code>name<\/code>, <code>my_score<\/code>, <code>level2<\/code>.<\/li><li>Нельзя начинать с цифры: <code>2name<\/code> — ошибка.<\/li><li>Нельзя пробелы: вместо <code>my name<\/code> пиши <code>my_name<\/code>.<\/li><li><code>Age<\/code> и <code>age<\/code> — <b>разные<\/b> переменные.<\/li><li>Давай понятные имена: <code>price<\/code> лучше, чем <code>p<\/code>.<\/li><\/ul>\n<h3>Типы данных<\/h3>\n<p>У каждого значения есть тип — «что это такое».<\/p>\n<ul><li><code>int<\/code> — целое число: <code>5<\/code>, <code>-3<\/code>, <code>100<\/code><\/li><li><code>float<\/code> — дробное число: <code>3.14<\/code>, <code>0.5<\/code>. <b>Пишем через точку, а не через запятую!<\/b><\/li><li><code>str<\/code> — строка (текст): <code>\"привет\"<\/code>, <code>\"25\"<\/code>. Всё, что в кавычках, — строка, даже цифры.<\/li><li><code>bool<\/code> — логическое: <code>True<\/code> (правда) или <code>False<\/code> (ложь). Понадобится в теме про условия.<\/li><\/ul>\n<p>Узнать тип можно командой <code>type()<\/code>:<\/p>\n<pre class=\"code\">print(type(5))\nprint(type(\"5\"))<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>&lt;class 'int'&gt;\n&lt;class 'str'&gt;<\/pre><\/div>\n<h3>С кавычками или без?<\/h3>\n<pre class=\"code\">name = \"Макс\"\nprint(name)\nprint(\"name\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>Макс\nname<\/pre><\/div>\n<p>Без кавычек <code>name<\/code> — это переменная, Python достаёт её значение. В кавычках <code>\"name\"<\/code> — просто текст из четырёх букв.<\/p>\n<div class=\"tip\">💡 Частая ошибка: использовать переменную до того, как её создали. Python читает сверху вниз и про неё ещё не знает. Будет ошибка NameError.<\/div>", "tasks": [{"t": "quiz", "q": "Что делает строка age = 13?", "opts": ["Проверяет, равно ли age числу 13", "Кладёт число 13 в переменную age", "Печатает 13", "Выдаёт ошибку"], "a": 1, "why": "= — это команда «положи в коробку».", "id": "vars-1"}, {"t": "quiz", "q": "Какое имя переменной правильное?", "opts": ["2name", "my name", "my_name", "my-name"], "a": 2, "why": "Нельзя начинать с цифры, нельзя пробелы и дефис. Подчёркивание _ можно.", "id": "vars-2"}, {"t": "quiz", "q": "Какой тип у значения 3.14?", "opts": ["int", "float", "str", "bool"], "a": 1, "why": "Дробное число — float.", "id": "vars-3"}, {"t": "quiz", "q": "Какой тип у значения \"25\"?", "opts": ["int", "float", "str", "bool"], "a": 2, "why": "В кавычках — значит строка, даже если там цифры.", "id": "vars-4"}, {"t": "quiz", "q": "Чем отличаются print(x) и print(\"x\")?", "opts": ["Ничем", "Первая печатает значение переменной x, вторая — букву x", "Первая печатает букву x, вторая — значение", "Вторая выдаст ошибку"], "a": 1, "why": "", "id": "vars-5"}, {"t": "quiz", "q": "Как правильно записать дробное число «два с половиной»?", "opts": ["2,5", "2.5", "2:5", "2 1/2"], "a": 1, "why": "В Python дробную часть отделяют точкой.", "id": "vars-6"}, {"t": "out", "q": "Что выведет программа?", "code": "a = 5\nb = 3\nprint(a + b)", "inputs": [], "why": "", "id": "vars-7", "a": "8"}, {"t": "out", "q": "Что выведет программа?", "code": "x = 10\nx = 20\nprint(x)", "inputs": [], "why": "Новое значение заменило старое.", "id": "vars-8", "a": "20"}, {"t": "out", "q": "Что выведет программа?", "code": "name = \"Макс\"\nprint(\"Привет,\", name)", "inputs": [], "why": "", "id": "vars-9", "a": "Привет, Макс"}, {"t": "out", "q": "Что выведет программа?", "code": "a = 4\nb = a\na = 7\nprint(a, b)", "inputs": [], "why": "b = a скопировало число 4 в b. Потом a поменяли, но b осталось 4.", "id": "vars-10", "a": "7 4"}, {"t": "out", "q": "Что выведет программа?", "code": "count = 1\ncount = count + 1\ncount = count + 1\nprint(count)", "inputs": [], "why": "", "id": "vars-11", "a": "3"}, {"t": "out", "q": "Что выведет программа?", "code": "x = 5\nprint(\"x\")\nprint(x)", "inputs": [], "why": "В кавычках — буква x, без кавычек — значение переменной.", "id": "vars-12", "a": "x\n5"}, {"t": "out", "q": "Что выведет программа?", "code": "a = 2\nb = 3\na = a * b\nb = a + b\nprint(a, b)", "inputs": [], "why": "Сначала a = 2 * 3 = 6. Потом b = 6 + 3 = 9.", "id": "vars-13", "a": "6 9"}, {"t": "out", "q": "Что выведет программа?", "code": "city = \"Москва\"\nprint(city, city)", "inputs": [], "why": "", "id": "vars-14", "a": "Москва Москва"}, {"t": "code", "q": "Создай переменную age со значением 13 и выведи её на экран.", "sol": "age = 13\nprint(age)", "tests": [[]], "start": "", "hint": "", "need": [["age\\s*=", "Создай переменную age"], ["print\\(\\s*age\\s*\\)", "Выведи переменную age (без кавычек)"]], "ban": [], "hide": false, "id": "vars-15", "exp": ["13"]}, {"t": "code", "q": "Создай переменные a = 12 и b = 8. Выведи их сумму, используя переменные.", "sol": "a = 12\nb = 8\nprint(a + b)", "tests": [[]], "start": "", "hint": "", "need": [["a\\s*\\+\\s*b|b\\s*\\+\\s*a", "Сложи переменные: a + b"]], "ban": [], "hide": false, "id": "vars-16", "exp": ["20"]}, {"t": "code", "q": "Посчитай стоимость покупки: переменная total = price * count. Выведи «Итого: 600».", "sol": "price = 150\ncount = 4\ntotal = price * count\nprint(\"Итого:\", total)", "tests": [[]], "start": "price = 150\ncount = 4", "hint": "print(\"Итого:\", total)", "need": [["total\\s*=", "Создай переменную total"]], "ban": [], "hide": false, "id": "vars-17", "exp": ["Итого: 600"]}, {"t": "code", "q": "Поменяй местами значения переменных a и b, чтобы последняя строка напечатала 2 1. Последнюю строку не меняй!", "sol": "a = 1\nb = 2\na, b = b, a\nprint(a, b)", "tests": [[]], "start": "a = 1\nb = 2\n# напиши код здесь\n\nprint(a, b)", "hint": "Возьми третью «коробку»: c = a, потом a = b, потом b = c.", "need": [["print\\(\\s*a\\s*,\\s*b\\s*\\)", "Последняя строка должна остаться print(a, b)"]], "ban": [], "hide": false, "id": "vars-18", "exp": ["2 1"]}, {"t": "code", "q": "Создай переменную score = 0. Три раза увеличь её на 10 (score = score + 10) и выведи.", "sol": "score = 0\nscore = score + 10\nscore = score + 10\nscore = score + 10\nprint(score)", "tests": [[]], "start": "", "hint": "", "need": [["score\\s*=\\s*0", "Начни с score = 0"]], "ban": [], "hide": false, "id": "vars-19", "exp": ["30"]}, {"t": "code", "q": "Создай переменные name = \"Аня\" и age = 12. Выведи: Аня 12 лет", "sol": "name = \"Аня\"\nage = 12\nprint(name, age, \"лет\")", "tests": [[]], "start": "", "hint": "", "need": [["print\\(.*name.*age", "Используй переменные name и age внутри print"]], "ban": [], "hide": false, "id": "vars-20", "exp": ["Аня 12 лет"]}, {"t": "code", "q": "Создай переменную x = 7. Выведи в одну строку x, x * 2 и x * 3.", "sol": "x = 7\nprint(x, x * 2, x * 3)", "tests": [[]], "start": "", "hint": "", "need": [["x\\s*\\*\\s*2", "Посчитай x * 2 в коде"]], "ban": [], "hide": false, "id": "vars-21", "exp": ["7 14 21"]}, {"t": "code", "q": "Создай переменную word = \"Python\" и выведи её три раза, каждый раз с новой строки.", "sol": "word = \"Python\"\nprint(word)\nprint(word)\nprint(word)", "tests": [[]], "start": "", "hint": "", "need": [["word\\s*=", "Создай переменную word"]], "ban": [], "hide": false, "id": "vars-22", "exp": ["Python\nPython\nPython"]}]}, {"id": "math", "emoji": "🧮", "title": "Арифметика и строки", "theory": "<h3>Python — это калькулятор<\/h3>\n<ul><li><code>+<\/code> сложение, <code>-<\/code> вычитание<\/li><li><code>*<\/code> умножение (звёздочка)<\/li><li><code>/<\/code> деление. <b>Результат всегда дробный:<\/b> <code>10 / 2<\/code> даёт <code>5.0<\/code><\/li><li><code>//<\/code> деление нацело (дробная часть отбрасывается)<\/li><li><code>%<\/code> остаток от деления<\/li><li><code><b><\/code> степень: <code>2 <\/b> 3<\/code> = 2 · 2 · 2 = 8<\/li><\/ul>\n<h3>// и % на конфетах<\/h3>\n<p>У тебя 17 конфет и 5 друзей. Делим поровну:<\/p>\n<pre class=\"code\">print(17 // 5)\nprint(17 % 5)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>3\n2<\/pre><\/div>\n<p>Каждому достанется 3 конфеты (<code>//<\/code>), и 2 останутся (<code>%<\/code>).<\/p>\n<p><code>%<\/code> очень полезен:<\/p>\n<ul><li><code>n % 2<\/code> равно 0, если число чётное, и 1, если нечётное.<\/li><li><code>n % 10<\/code> — последняя цифра числа: <code>1234 % 10<\/code> = 4.<\/li><li><code>n // 10<\/code> — число без последней цифры: <code>1234 // 10<\/code> = 123.<\/li><\/ul>\n<h3>Порядок действий как в математике<\/h3>\n<p>Сначала <code>**<\/code>, потом <code>*<\/code> <code>/<\/code> <code>//<\/code> <code>%<\/code>, потом <code>+<\/code> <code>-<\/code>. Скобки меняют порядок.<\/p>\n<pre class=\"code\">print(2 + 3 * 4)\nprint((2 + 3) * 4)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>14\n20<\/pre><\/div>\n<h3>Короткая запись<\/h3>\n<p><code>x = x + 5<\/code> можно записать короче: <code>x += 5<\/code>. Так же работают <code>-=<\/code>, <code>*=<\/code>, <code>/=<\/code>.<\/p>\n<h3>Действия со строками<\/h3>\n<p>Строки тоже можно складывать и умножать!<\/p>\n<pre class=\"code\">print(\"кот\" + \"ик\")\nprint(\"ха\" * 3)\nprint(len(\"Python\"))<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>котик\nхахаха\n6<\/pre><\/div>\n<p><code>+<\/code> склеивает строки, <code>*<\/code> повторяет, <code>len()<\/code> считает количество символов.<\/p>\n<h3>Строка и число — разные вещи<\/h3>\n<pre class=\"code\">print(\"5\" + \"5\")\nprint(5 + 5)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>55\n10<\/pre><\/div>\n<p>А <code>\"5\" + 5<\/code> — это ошибка: нельзя складывать текст и число. Превратить одно в другое можно так:<\/p>\n<ul><li><code>int(\"5\")<\/code> → число 5<\/li><li><code>str(5)<\/code> → строка <code>\"5\"<\/code><\/li><\/ul>", "tasks": [{"t": "quiz", "q": "Чему равно 7 // 2?", "opts": ["3.5", "3", "4", "1"], "a": 1, "why": "// отбрасывает дробную часть.", "id": "math-1"}, {"t": "quiz", "q": "Чему равно 7 % 2?", "opts": ["3", "1", "0", "3.5"], "a": 1, "why": "7 = 2 · 3 + 1, остаток 1.", "id": "math-2"}, {"t": "quiz", "q": "Чему равно 2 ** 3?", "opts": ["6", "5", "8", "9"], "a": 2, "why": "2 · 2 · 2 = 8.", "id": "math-3"}, {"t": "quiz", "q": "Что получится из \"3\" + \"4\"?", "opts": ["7", "34", "Ошибка", "3 4"], "a": 1, "why": "Строки склеиваются.", "id": "math-4"}, {"t": "quiz", "q": "Что выведет print(10 / 2)?", "opts": ["5", "5.0", "5,0", "Ошибку"], "a": 1, "why": "Обычное деление / всегда даёт дробное число.", "id": "math-5"}, {"t": "quiz", "q": "Что получится из \"5\" + 5?", "opts": ["10", "55", "Ошибка", "5 5"], "a": 2, "why": "Строку и число складывать нельзя.", "id": "math-6"}, {"t": "quiz", "q": "Остаток от деления любого чётного числа на 2 равен…", "opts": ["0", "1", "2", "Бывает по-разному"], "a": 0, "why": "", "id": "math-7"}, {"t": "out", "q": "Что выведет программа?", "code": "print(2 + 3 * 4)", "inputs": [], "why": "Сначала умножение: 3 · 4 = 12, потом 2 + 12.", "id": "math-8", "a": "14"}, {"t": "out", "q": "Что выведет программа?", "code": "print((2 + 3) * 4)", "inputs": [], "why": "Скобки первыми: 5 · 4.", "id": "math-9", "a": "20"}, {"t": "out", "q": "Что выведет программа?", "code": "print(17 // 5, 17 % 5)", "inputs": [], "why": "", "id": "math-10", "a": "3 2"}, {"t": "out", "q": "Что выведет программа?", "code": "print(\"ла\" * 3)", "inputs": [], "why": "", "id": "math-11", "a": "лалала"}, {"t": "out", "q": "Что выведет программа?", "code": "a = \"кот\"\nb = \"ик\"\nprint(a + b)", "inputs": [], "why": "", "id": "math-12", "a": "котик"}, {"t": "out", "q": "Что выведет программа?", "code": "x = 10\nx += 5\nx *= 2\nprint(x)", "inputs": [], "why": "10 + 5 = 15, потом 15 · 2 = 30.", "id": "math-13", "a": "30"}, {"t": "out", "q": "Что выведет программа?", "code": "print(len(\"Python\"))", "inputs": [], "why": "", "id": "math-14", "a": "6"}, {"t": "out", "q": "Что выведет программа?", "code": "n = 1234\nprint(n % 10)\nprint(n // 10)", "inputs": [], "why": "", "id": "math-15", "a": "4\n123"}, {"t": "code", "q": "Посчитай, сколько секунд в одном часе (60 минут по 60 секунд). Пусть считает Python.", "sol": "print(60 * 60)", "tests": [[]], "start": "", "hint": "", "need": [["\\*", "Используй умножение *"]], "ban": [], "hide": true, "id": "math-16", "exp": ["3600"]}, {"t": "code", "q": "В классе 27 учеников, их делят на команды по 4 человека. Выведи через пробел, сколько получится полных команд и сколько человек останется.", "sol": "pupils = 27\nprint(pupils // 4, pupils % 4)", "tests": [[]], "start": "", "hint": "", "need": [["//", "Используй //"], ["%", "Используй %"]], "ban": [], "hide": true, "id": "math-17", "exp": ["6 3"]}, {"t": "code", "q": "Выведи квадрат числа 15, используя **.", "sol": "print(15 ** 2)", "tests": [[]], "start": "", "hint": "", "need": [["\\*\\*", "Используй **"]], "ban": [], "hide": true, "id": "math-18", "exp": ["225"]}, {"t": "code", "q": "У прямоугольника длина a = 8 и ширина b = 5. Выведи периметр и площадь, как в примере.", "sol": "a = 8\nb = 5\nprint(\"Периметр:\", 2 * (a + b))\nprint(\"Площадь:\", a * b)", "tests": [[]], "start": "a = 8\nb = 5", "hint": "Периметр = 2 * (a + b), площадь = a * b.", "need": [["a\\s*\\*\\s*b|b\\s*\\*\\s*a", "Площадь посчитай через переменные: a * b"]], "ban": [], "hide": false, "id": "math-19", "exp": ["Периметр: 26\nПлощадь: 40"]}, {"t": "code", "q": "Склей переменные word1 и word2 в одно слово и выведи его.", "sol": "word1 = \"супер\"\nword2 = \"герой\"\nprint(word1 + word2)", "tests": [[]], "start": "word1 = \"супер\"\nword2 = \"герой\"", "hint": "", "need": [["word1\\s*\\+\\s*word2", "Склей их знаком +"]], "ban": [], "hide": false, "id": "math-20", "exp": ["супергерой"]}, {"t": "code", "q": "Выведи линию из 20 знаков = с помощью умножения строки.", "sol": "print(\"=\" * 20)", "tests": [[]], "start": "", "hint": "", "need": [["\\*\\s*20|20\\s*\\*", "Умножь строку на 20"]], "ban": [], "hide": false, "id": "math-21", "exp": ["===================="]}, {"t": "code", "q": "Дано число n = 4567. Выведи его последнюю цифру с помощью %.", "sol": "n = 4567\nprint(n % 10)", "tests": [[]], "start": "n = 4567", "hint": "", "need": [["%\\s*10", "Используй % 10"]], "ban": [], "hide": true, "id": "math-22", "exp": ["7"]}, {"t": "code", "q": "Переведи m = 135 минут в часы и минуты. Выведи: 2 ч 15 мин", "sol": "m = 135\nprint(m // 60, \"ч\", m % 60, \"мин\")", "tests": [[]], "start": "m = 135", "hint": "", "need": [["//\\s*60", "Часы посчитай через // 60"], ["%\\s*60", "Минуты посчитай через % 60"]], "ban": [], "hide": false, "id": "math-23", "exp": ["2 ч 15 мин"]}, {"t": "code", "q": "Дана строка s = \"Привет\". Выведи количество букв в ней с помощью len().", "sol": "s = \"Привет\"\nprint(len(s))", "tests": [[]], "start": "s = \"Привет\"", "hint": "", "need": [["len\\(", "Используй len()"]], "ban": [], "hide": true, "id": "math-24", "exp": ["6"]}]}, {"id": "input", "emoji": "⌨️", "title": "Ввод данных: input()", "theory": "<h3>Программа задаёт вопрос<\/h3>\n<p><code>input()<\/code> останавливает программу и ждёт, пока человек что-то напечатает и нажмёт Enter. То, что он ввёл, можно положить в переменную.<\/p>\n<pre class=\"code\">name = input(\"Как тебя зовут? \")\nprint(\"Привет,\", name)<\/pre>\n<p>Если ввести <code>Маша<\/code>, программа напишет:<\/p>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>Как тебя зовут? Маша\nПривет, Маша<\/pre><\/div>\n<p>Текст в скобках — подсказка для человека. Её можно не писать: <code>input()<\/code>.<\/p>\n<h3>Главное правило: input() всегда даёт строку!<\/h3>\n<p>Даже если ввели цифры, Python получит <b>текст<\/b>:<\/p>\n<pre class=\"code\">a = input()   # ввели 5\nb = input()   # ввели 3\nprint(a + b)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>53<\/pre><\/div>\n<p>Получилось не 8, а <code>53<\/code>: строки склеились!<\/p>\n<h3>Как получить число<\/h3>\n<p>Оберни <code>input()<\/code> в <code>int()<\/code> — и строка превратится в целое число:<\/p>\n<pre class=\"code\">a = int(input())   # ввели 5\nb = int(input())   # ввели 3\nprint(a + b)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>8<\/pre><\/div>\n<p>Для дробных чисел используй <code>float()<\/code>: <code>x = float(input())<\/code>.<\/p>\n<h3>Каждый input() читает одну строку<\/h3>\n<p>Чтобы получить два значения, нужно два раза вызвать <code>input()<\/code>.<\/p>\n<div class=\"tip\">💡 Как проверяются задачи в тренажёре: он сам «вводит» данные вместо человека и сравнивает, что напечатала программа. Подсказки внутри input(\"...\") он не учитывает, так что пиши их или нет — как хочешь.<\/div>\n<div class=\"tip\">💡 Если <code>int()<\/code> получит не число, например <code>int(\"привет\")<\/code>, будет ошибка ValueError.<\/div>", "tasks": [{"t": "quiz", "q": "Что всегда возвращает input()?", "opts": ["Число", "Строку (текст)", "Дробное число", "Ничего"], "a": 1, "why": "Даже если человек ввёл цифры, это будет строка.", "id": "input-1"}, {"t": "quiz", "q": "Пользователь ввёл 5. Что выведет программа?\na = input()\nprint(a + a)", "opts": ["10", "55", "5", "Ошибку"], "a": 1, "why": "a — это строка \"5\", строки склеиваются.", "id": "input-2"}, {"t": "quiz", "q": "Как получить от пользователя целое число?", "opts": ["input(int())", "int(input())", "number(input())", "input().int"], "a": 1, "why": "", "id": "input-3"}, {"t": "quiz", "q": "Пользователь будет вводить дробное число, например 2.5. Что нужно использовать?", "opts": ["int(input())", "float(input())", "str(input())", "просто input()"], "a": 1, "why": "", "id": "input-4"}, {"t": "quiz", "q": "Что произойдёт при int(\"привет\")?", "opts": ["Получится 0", "Получится строка", "Будет ошибка", "Получится 6"], "a": 2, "why": "Слово нельзя превратить в число — ошибка ValueError.", "id": "input-5"}, {"t": "quiz", "q": "Сколько раз нужно вызвать input(), чтобы ввести два числа на разных строках?", "opts": ["1", "2", "3", "Сколько угодно"], "a": 1, "why": "", "id": "input-6"}, {"t": "out", "q": "Что выведет программа?", "code": "name = input()\nprint(\"Привет,\", name)", "inputs": ["Маша"], "why": "", "id": "input-7", "a": "Привет, Маша"}, {"t": "out", "q": "Что выведет программа?", "code": "a = input()\nb = input()\nprint(a + b)", "inputs": ["3", "4"], "why": "Без int() это строки, они склеиваются.", "id": "input-8", "a": "34"}, {"t": "out", "q": "Что выведет программа?", "code": "a = int(input())\nb = int(input())\nprint(a + b)", "inputs": ["3", "4"], "why": "", "id": "input-9", "a": "7"}, {"t": "out", "q": "Что выведет программа?", "code": "n = int(input())\nprint(n * n)", "inputs": ["6"], "why": "", "id": "input-10", "a": "36"}, {"t": "out", "q": "Что выведет программа?", "code": "s = input()\nprint(s * 3)", "inputs": ["ой"], "why": "", "id": "input-11", "a": "ойойой"}, {"t": "out", "q": "Что выведет программа?", "code": "x = int(input())\nprint(x // 3, x % 3)", "inputs": ["10"], "why": "", "id": "input-12", "a": "3 1"}, {"t": "code", "q": "Прочитай имя и выведи приветствие с восклицательным знаком, как в примере.", "sol": "name = input()\nprint(\"Привет,\", name + \"!\")", "tests": [["Маша"], ["Петя"], ["Оля"]], "start": "", "hint": "Чтобы «!» стоял без пробела, приклей его: name + \"!\"", "need": [], "ban": [], "hide": false, "id": "input-13", "exp": ["Привет, Маша!", "Привет, Петя!", "Привет, Оля!"]}, {"t": "code", "q": "Прочитай целое число и выведи его, умноженное на 2.", "sol": "n = int(input())\nprint(n * 2)", "tests": [["5"], ["12"], ["0"], ["-4"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-14", "exp": ["10", "24", "0", "-8"]}, {"t": "code", "q": "Прочитай два целых числа (каждое на своей строке) и выведи их сумму.", "sol": "a = int(input())\nb = int(input())\nprint(a + b)", "tests": [["3", "4"], ["10", "25"], ["-5", "5"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-15", "exp": ["7", "35", "0"]}, {"t": "code", "q": "Прочитай два целых числа и выведи их сумму, разность и произведение — каждое на новой строке.", "sol": "a = int(input())\nb = int(input())\nprint(a + b)\nprint(a - b)\nprint(a * b)", "tests": [["7", "3"], ["2", "10"], ["0", "5"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-16", "exp": ["10\n4\n21", "12\n-8\n20", "5\n-5\n0"]}, {"t": "code", "q": "Прочитай число n и выведи следующее и предыдущее число, как в примере.", "sol": "n = int(input())\nprint(\"Следующее:\", n + 1)\nprint(\"Предыдущее:\", n - 1)", "tests": [["7"], ["100"], ["0"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-17", "exp": ["Следующее: 8\nПредыдущее: 6", "Следующее: 101\nПредыдущее: 99", "Следующее: 1\nПредыдущее: -1"]}, {"t": "code", "q": "Прочитай сторону квадрата и выведи через пробел его площадь и периметр.", "sol": "a = int(input())\nprint(a * a, 4 * a)", "tests": [["5"], ["1"], ["12"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-18", "exp": ["25 20", "1 4", "144 48"]}, {"t": "code", "q": "Прочитай год рождения и выведи, сколько лет человеку исполнится в 2026 году.", "sol": "y = int(input())\nprint(2026 - y)", "tests": [["2013"], ["1988"], ["2026"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-19", "exp": ["13", "38", "0"]}, {"t": "code", "q": "Прочитай слово, затем число n. Выведи слово n раз подряд без пробелов.", "sol": "word = input()\nn = int(input())\nprint(word * n)", "tests": [["ку", "3"], ["Python", "2"], ["а", "5"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-20", "exp": ["кукуку", "PythonPython", "ааааа"]}, {"t": "code", "q": "Пицца: прочитай количество кусков, затем количество людей. Выведи, сколько кусков достанется каждому и сколько останется.", "sol": "pieces = int(input())\npeople = int(input())\nprint(\"Каждому:\", pieces // people)\nprint(\"Осталось:\", pieces % people)", "tests": [["8", "3"], ["12", "4"], ["5", "7"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-21", "exp": ["Каждому: 2\nОсталось: 2", "Каждому: 3\nОсталось: 0", "Каждому: 0\nОсталось: 5"]}, {"t": "code", "q": "Прочитай число секунд и переведи в минуты и секунды, как в примере.", "sol": "s = int(input())\nprint(s // 60, \"мин\", s % 60, \"сек\")", "tests": [["125"], ["60"], ["59"], ["3600"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "input-22", "exp": ["2 мин 5 сек", "1 мин 0 сек", "0 мин 59 сек", "60 мин 0 сек"]}, {"t": "code", "q": "Прочитай имя, затем возраст. Выведи фразу, как в примере.", "sol": "name = input()\nage = int(input())\nprint(name + \",\", \"через 5 лет тебе будет\", age + 5)", "tests": [["Маша", "13"], ["Дима", "10"]], "start": "", "hint": "Запятую приклей к имени: name + \",\"", "need": [], "ban": [], "hide": false, "id": "input-23", "exp": ["Маша, через 5 лет тебе будет 18", "Дима, через 5 лет тебе будет 15"]}]}, {"id": "if", "emoji": "🔀", "title": "Условия: if, elif, else", "theory": "<h3>Программа принимает решения<\/h3>\n<p>Иногда нужно делать разное в разных случаях. «<b>Если<\/b> идёт дождь — возьми зонт, <b>иначе<\/b> — кепку». В Python это <code>if<\/code> (если) и <code>else<\/code> (иначе).<\/p>\n<pre class=\"code\">age = int(input())\nif age &gt;= 14:\n    print(\"Можно получить паспорт\")\nelse:\n    print(\"Пока рано\")<\/pre>\n<h3>Правила записи<\/h3>\n<ul><li>После условия ставим <b>двоеточие<\/b> <code>:<\/code>.<\/li><li>Команды внутри <code>if<\/code> пишем с <b>отступом<\/b> — 4 пробела (или клавиша Tab).<\/li><li>Отступ показывает, какие команды «принадлежат» условию. Строки без отступа выполняются всегда.<\/li><\/ul>\n<pre class=\"code\">x = 3\nif x &gt; 5:\n    print(\"большое\")\nprint(\"конец\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>конец<\/pre><\/div>\n<p><code>print(\"большое\")<\/code> не выполнился, потому что 3 не больше 5. А <code>print(\"конец\")<\/code> без отступа — он вне условия.<\/p>\n<h3>Знаки сравнения<\/h3>\n<ul><li><code>==<\/code> равно (<b>два<\/b> знака! Один <code>=<\/code> — это «положи в коробку»)<\/li><li><code>!=<\/code> не равно<\/li><li><code>&gt;<\/code> больше, <code>&lt;<\/code> меньше<\/li><li><code>&gt;=<\/code> больше или равно, <code>&lt;=<\/code> меньше или равно<\/li><\/ul>\n<h3>Много вариантов: elif<\/h3>\n<p><code>elif<\/code> — «иначе если». Python проверяет условия сверху вниз и выполняет <b>первое<\/b> подходящее. Остальные пропускает.<\/p>\n<pre class=\"code\">t = 15\nif t &gt; 25:\n    print(\"жарко\")\nelif t &gt; 10:\n    print(\"тепло\")\nelse:\n    print(\"холодно\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>тепло<\/pre><\/div>\n<h3>Несколько условий сразу<\/h3>\n<ul><li><code>and<\/code> — «и»: верно, только если <b>оба<\/b> условия верны.<\/li><li><code>or<\/code> — «или»: верно, если <b>хотя бы одно<\/b> верно.<\/li><li><code>not<\/code> — «не»: переворачивает правду в ложь.<\/li><\/ul>\n<pre class=\"code\">age = 13\nif age &gt;= 10 and age &lt;= 15:\n    print(\"подросток\")<\/pre>\n<h3>Чётное или нечётное?<\/h3>\n<pre class=\"code\">n = int(input())\nif n % 2 == 0:\n    print(\"чётное\")\nelse:\n    print(\"нечётное\")<\/pre>\n<div class=\"tip\">💡 Частые ошибки: забыть двоеточие; забыть отступ; написать <code>=<\/code> вместо <code>==<\/code>.<\/div>", "tasks": [{"t": "quiz", "q": "Каким знаком проверяют, равны ли два значения?", "opts": ["=", "==", "===", "=>"], "a": 1, "why": "Один = — положить в переменную, два == — сравнить.", "id": "if-1"}, {"t": "quiz", "q": "Что ставится в конце строки с if?", "opts": ["Точка с запятой ;", "Двоеточие :", "Точка .", "Ничего"], "a": 1, "why": "", "id": "if-2"}, {"t": "quiz", "q": "Зачем нужен отступ под if?", "opts": ["Для красоты", "Он показывает, какие команды выполняются внутри условия", "Чтобы программа работала быстрее", "Он не нужен"], "a": 1, "why": "", "id": "if-3"}, {"t": "quiz", "q": "Что значит знак != ?", "opts": ["Очень равно", "Не равно", "Больше", "Ошибка"], "a": 1, "why": "", "id": "if-4"}, {"t": "quiz", "q": "Чему равно 5 > 3 and 2 > 4 ?", "opts": ["True", "False"], "a": 1, "why": "and требует, чтобы оба были верны. 2 > 4 — неверно.", "id": "if-5"}, {"t": "quiz", "q": "Чему равно 5 > 3 or 2 > 4 ?", "opts": ["True", "False"], "a": 0, "why": "or: достаточно одного верного.", "id": "if-6"}, {" ["чётное", "нечётное", "чётное", "нечётное"]}, {"t": "code", "q": "Прочитай два целых числа и выведи большее из них (если равны — любое).", "sol": "a = int(input())\nb = int(input())\nif a > b:\n    print(a)\nelse:\n    print(b)", "tests": [["3", "8"], ["10", "2"], ["5", "5"]], "start": "", "hint": "", "need": [["\\bif\\b", "Используй if"]], "ban": [["max\\(", "Попробуй без max() — через if"]], "hide": false, "id": "if-15", "exp": ["8", "10", "5"]}, {"t": "code", "q": "Прочитай возраст. Если 14 или больше — выведи «Можно получить паспорт», иначе — «Пока рано».", "sol": "age = int(input())\nif age >= 14:\n    print(\"Можно получить паспорт\")\nelse:\n    print(\"Пока рано\")", "tests": [["13"], ["14"], ["20"]], "start": "", "hint": "Больше или равно — это >=", "need": [], "ban": [], "hide": false, "id": "if-16", "exp": ["Пока рано", "Можно получить паспорт", "Можно получить паспорт"]}, {"t": "code", "q": "Прочитай баллы за тест (0–100) и выведи оценку: 90 и больше — 5, от 75 — 4, от 50 — 3, иначе — 2.", "sol": "p = int(input())\nif p >= 90:\n    print(5)\nelif p >= 75:\n    print(4)\nelif p >= 50:\n    print(3)\nelse:\n    print(2)", "tests": [["95"], ["90"], ["80"], ["75"], ["60"], ["50"], ["30"]], "start": "", "hint": "Проверяй сверху вниз: сначала >= 90, потом >= 75, потом >= 50.", "need": [["\\belif\\b", "Используй elif"]], "ban": [], "hide": false, "id": "if-17", "exp": ["5", "5", "4", "4", "3", "3", "2"]}, {"t": "code", "q": "Прочитай целое число. Если оно делится на 3, выведи «делится на 3», иначе — «не делится».", "sol": "n = int(input())\nif n % 3 == 0:\n    print(\"делится на 3\")\nelse:\n    print(\"не делится\")", "tests": [["9"], ["10"], ["0"], ["21"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "if-18", "exp": ["делится на 3", "не делится", "делится на 3", "делится на 3"]}, {"t": "code", "q": "Прочитай пароль. Если он равен python123, выведи «Доступ разрешён», иначе — «Неверный пароль».", "sol": "p = input()\nif p == \"python123\":\n    print(\"Доступ разрешён\")\nelse:\n    print(\"Неверный пароль\")", "tests": [["python123"], ["12345"], ["Python123"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "if-19", "exp": ["Доступ разрешён", "Неверный пароль", "Неверный пароль"]}, {"t": "code", "q": "Прочитай целое число. Если оно от 10 до 20 включительно, выведи «в диапазоне», иначе — «вне диапазона».", "sol": "n = int(input())\nif n >= 10 and n <= 20:\n    print(\"в диапазоне\")\nelse:\n    print(\"вне диапазона\")", "tests": [["10"], ["20"], ["15"], ["9"], ["21"]], "start": "", "hint": "Используй and: n >= 10 and n <= 20", "need": [], "ban": [], "hide": false, "id": "if-20", "exp": ["в диапазоне", "в диапазоне", "в диапазоне", "вне диапазона", "вне диапазона"]}, {"t": "code", "q": "Прочитай целое число и выведи «плюс», если оно положительное, «минус», если отрицательное, и «ноль», если это 0.", "sol": "n = int(input())\nif n > 0:\n    print(\"плюс\")\nelif n < 0:\n    print(\"минус\")\nelse:\n    print(\"ноль\")", "tests": [["7"], ["-2"], ["0"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "if-21", "exp": ["плюс", "минус", "ноль"]}, {"t": "code", "q": "Прочитай целое число и выведи его без минуса (модуль числа). Не используй abs()!", "sol": "n = int(input())\nif n < 0:\n    n = -n\nprint(n)", "tests": [["-5"], ["7"], ["0"]], "start": "", "hint": "Если число меньше 0, поменяй знак: n = -n", "need": [], "ban": [["abs\\(", "Попробуй без abs() — через if"]], "hide": false, "id": "if-22", "exp": ["5", "7", "0"]}, {"t": "code", "q": "Светофор: прочитай цвет. Для «красный» выведи «Стой», для «жёлтый» — «Жди», для «зелёный» — «Иди», для любого другого — «Нет такого цвета».", "sol": "c = input()\nif c == \"красный\":\n    print(\"Стой\")\nelif c == \"жёлтый\":\n    print(\"Жди\")\nelif c == \"зелёный\":\n    print(\"Иди\")\nelse:\n    print(\"Нет такого цвета\")", "tests": [["красный"], ["жёлтый"], ["зелёный"], ["синий"]], "start": "", "hint": "", "need": [], "ban": [], "hide": false, "id": "if-23", "exp": ["Стой", "Жди", "Иди", "Нет такого цвета"]}]}, {"id": "for", "emoji": "🔁", "title": "Цикл for и range()", "theory": "<h3>Зачем нужны циклы<\/h3>\n<p>Нужно напечатать «Привет» 100 раз? Писать 100 строк <code>print<\/code> скучно. Цикл повторяет команды сам.<\/p>\n<pre class=\"code\">for i in range(3):\n    print(\"Привет\")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>Привет\nПривет\nПривет<\/pre><\/div>\n<p>Как и в <code>if<\/code>: в конце двоеточие, а команды, которые повторяются, — с отступом.<\/p>\n<h3>Что такое i<\/h3>\n<p><code>i<\/code> — это переменная-счётчик. На каждом круге цикла в ней новое число:<\/p>\n<pre class=\"code\">for i in range(4):\n    print(i)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>0\n1\n2\n3<\/pre><\/div>\n<p><b>Счёт начинается с 0!<\/b> <code>range(4)<\/code> даёт 0, 1, 2, 3 — четыре числа, но четвёрки среди них нет.<\/p>\n<h3>range — генератор чисел<\/h3>\n<ul><li><code>range(5)<\/code> → 0, 1, 2, 3, 4<\/li><li><code>range(1, 6)<\/code> → 1, 2, 3, 4, 5 (старт включается, конец — <b>нет<\/b>)<\/li><li><code>range(0, 10, 2)<\/code> → 0, 2, 4, 6, 8 (третье число — шаг)<\/li><li><code>range(5, 0, -1)<\/code> → 5, 4, 3, 2, 1 (шаг может быть отрицательным)<\/li><\/ul>\n<p>Хочешь числа от 1 до 10 — пиши <code>range(1, 11)<\/code>.<\/p>\n<h3>Печать в одну строку<\/h3>\n<p>Помнишь <code>end<\/code>? Он пригодится в циклах:<\/p>\n<pre class=\"code\">for i in range(1, 6):\n    print(i, end=\" \")<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>1 2 3 4 5<\/pre><\/div>\n<h3>Копилка: считаем сумму<\/h3>\n<p>Частый приём — завести переменную до цикла и добавлять в неё на каждом круге:<\/p>\n<pre class=\"code\">total = 0\nfor i in range(1, 5):\n    total = total + i\nprint(total)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>10<\/pre><\/div>\n<p>0 + 1 + 2 + 3 + 4 = 10. Обрати внимание: <code>print(total)<\/code> <b>без отступа<\/b>, поэтому он выполнится один раз, после цикла.<\/p>\n<h3>Цикл по строке<\/h3>\n<p><code>for<\/code> умеет перебирать буквы в слове:<\/p>\n<pre class=\"code\">for letter in \"кот\":\n    print(letter)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>к\nо\nт<\/pre><\/div>\n<div class=\"tip\">💡 <code>for<\/code> подходит, когда заранее известно, сколько раз повторять.<\/div>", "tasks": [{"t": "quiz", "q": "Сколько раз выполнится тело цикла for i in range(5)?", "opts": ["4", "5", "6", "Бесконечно"], "a": 1, "why": "", "id": "for-1"}, {"t": "quiz", "q": "Какие числа даёт range(3)?", "opts": ["1 2 3", "0 1 2", "0 1 2 3", "3"], "a": 1, "why": "Счёт с нуля, конец не включается.", "id": "for-2"}, {"t": "quiz", "q": "Какие числа даёт range(2, 6)?", "opts": ["2 3 4 5 6", "2 3 4 5", "3 4 5", "2 4 6"], "a": 1, "why": "", "id": "for-3"}, {"t": "quiz", "q": "Какие числа даёт range(0, 10, 3)?", "opts": ["0 3 6 9", "3 6 9", "0 3 6", "0 3 6 9 12"], "a": 0, "why": "", "id": "for-4"}, {"t": "quiz", "q": "Как получить числа от 1 до 10 включительно?", "opts": ["range(10)", "range(1, 10)", "range(1, 11)", "range(0, 10)"], "a": 2, "why": "", "id": "for-5"}, {"t": "quiz", "q": "Как Python понимает, какие команды нужно повторять в цикле?", "opts": ["По отступу", "По пустой строке", "Повторяет все команды до конца программы", "По слову end"], "a": 0, "why": "", "id": "for-6"}, {"t": "out", "q": "Что выведет программа?", "code": "for i in range(3):\n    print(\"Привет\")", "inputs": [], "why": "", "id": "for-7", "a": "Привет\nПривет\nПривет"}, {"t": "out", "q": "Что выведет программа?", "code": "for i in range(4):\n    print(i)", "inputs": [], "why": "", "id": "for-8", "a": "0\n1\n2\n3"}, {"t": "out", "q": "Что выведет программа?", "code": "for i in range(1, 6):\n    print(i * 2, end=\" \")", "inputs": [], "why": "", "id": "for-9", "a": "2 4 6 8 10 "}, {"t": "out", "q": "Что выведет программа?", "code": "s = 0\nfor i i ode", "q": "Прочитай число n, затем n целых чисел (каждое на своей строке). Выведи их сумму.", "sol": "n = int(input())\ns = 0\nfor i in range(n):\n    x = int(input())\n    s = s + x\nprint(s)", "tests": [["3", "1", "2", "3"], ["5", "10", "20", "30", "40", "50"], ["1", "-7"]], "start": "", "hint": "input() можно вызывать внутри цикла: каждый круг читает новое число.", "need": [["\\bfor\\b", "Используй цикл for"]], "ban": [], "hide": false, "id": "for-23", "exp": ["6", "150", "-7"]}, {"t": "code", "q": "Прочитай n и выведи факториал n — произведение 1 · 2 · 3 · … · n.", "sol": "n = int(input())\nf = 1\nfor i in range(1, n + 1):\n    f = f * i\nprint(f)", "tests": [["5"], ["1"], ["6"], ["10"]], "start": "", "hint": "Как сумма, только начинаем с 1 и умножаем.", "need": [["\\bfor\\b", "Используй цикл for"]], "ban": [], "hide": false, "id": "for-24", "exp": ["120", "1", "720", "3628800"]}, {"t": "code", "q": "Прочитай слово и посчитай, сколько раз в нём встречается русская буква «а».", "sol": "word = input()\ncount = 0\nfor letter in word:\n    if letter == \"а\":\n        count = count + 1\nprint(count)", "tests": [["банан"], ["абракадабра"], ["кот"]], "start": "", "hint": "Перебирай буквы: for letter in word, внутри if letter == \"а\".", "need": [["\\bfor\\b", "Используй цикл for"]], "ban": [["\\.count\\(", "Попробуй без .count() — через цикл и if"]], "hide": false, "id": "for-25", "exp": ["2", "5", "0"]}]}, {"id": "while", "emoji": "🔄", "title": "Цикл while", "theory": "<h3>Повторяй, пока…<\/h3>\n<p><code>while<\/code> значит «пока». Цикл повторяется, <b>пока условие верно<\/b>.<\/p>\n<pre class=\"code\">i = 1\nwhile i &lt;= 3:\n    print(i)\n    i = i + 1<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>1\n2\n3<\/pre><\/div>\n<p>Как это работает:<\/p>\n<ul><li>Проверяем условие <code>i &lt;= 3<\/code>. Верно? Выполняем команды с отступом.<\/li><li>Возвращаемся наверх и проверяем снова.<\/li><li>Когда <code>i<\/code> стало 4, условие неверно, и цикл заканчивается.<\/li><\/ul>\n<h3>for или while?<\/h3>\n<ul><li><code>for<\/code> — когда знаешь, <b>сколько раз<\/b> повторять: «10 раз», «для каждой буквы».<\/li><li><code>while<\/code> — когда повторяешь, <b>пока что-то не случится<\/b>: «пока не введут правильный пароль», «пока не накопим 1000 рублей».<\/li><\/ul>\n<h3>Опасность: бесконечный цикл<\/h3>\n<p>Если внутри цикла не менять то, что проверяется в условии, оно будет верным всегда:<\/p>\n<pre class=\"code\">i = 1\nwhile i &lt;= 3:\n    print(i)\n    # забыли i = i + 1 — цикл никогда не закончится!<\/pre>\n<p>Тренажёр остановит такую программу и подскажет.<\/p>\n<h3>break — аварийный выход<\/h3>\n<p><code>break<\/code> сразу прекращает цикл. Часто пишут <code>while True:<\/code> (повторяй всегда) и выходят через <code>break<\/code>:<\/p>\n<pre class=\"code\">while True:\n    word = input()\n    if word == \"стоп\":\n        break\n    print(\"Ты ввёл:\", word)\nprint(\"Пока!\")<\/pre>\n<h3>Пример: читаем числа до нуля<\/h3>\n<pre class=\"code\">total = 0\nn = int(input())\nwhile n != 0:\n    total = total + n\n    n = int(input())\nprint(total)<\/pre>\n<p>Если ввести 5, 3, 0, программа напечатает <code>8<\/code>.<\/p>\n<h3>Цифры числа<\/h3>\n<p>С <code>while<\/code> удобно разбирать число по цифрам: <code>n % 10<\/code> — последняя цифра, <code>n // 10<\/code> — отрезать её.<\/p>\n<pre class=\"code\">n = 512\nwhile n &gt; 0:\n    print(n % 10)\n    n = n // 10<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>2\n1\n5<\/pre><\/div>", "tasks": [{"t": "quiz", "q": "Когда цикл while перестаёт повторяться?", "opts": ["Через 10 повторов", "Когда условие становится неверным", "Когда условие становится верным", "Никогда"], "a": 1, "why": "", "id": "while-1"}, {"t": "quiz", "q": "Что будет, если в цикле не менять переменную из условия?", "opts": ["Цикл выполнится 1 раз", "Ошибка", "Цикл может стать бесконечным", "Ничего"], "a": 2, "why": "", "id": "while-2"}, {"t": "quiz", "q": "Что делает break?", "opts": ["Начинает цикл заново", "Сразу выходит из цикла", "Пропускает одну строку", "Останавливает компьютер"], "a": 1, "why": "", "id": "while-3"}, {"t": "quiz", "q": "Сколько раз выполнится тело цикла?\ni = 0\nwhile i < 3:\n    i = i + 1", "opts": ["2", "3", "4", "Бесконечно"], "a": 1, "why": "", "id": "while-4"}, {"t": "quiz", "q": "Когда удобнее использовать while, а не for?", "opts": ["Когда точно знаешь число повторов", "Когда заранее неизвестно, сколько раз повторять", "Когда нужно перебрать буквы", "Никогда"], "a": 1, "why": "", "id": "while-5"}, {"t": "quiz", "q": "Сколько раз напечатается «x»?\nwhile False:\n    print(\"x\")", "opts": ["0", "1", "Бесконечно", "Будет ошибка"], "a": 0, "why": "Условие сразу неверно, цикл не выполнится ни разу.", "id": "while-6"}, {"t": "out", "q": "Что выведет программа?", "code": "i = 1\nwhile i <= 3:\n    print(i)\n    i = i + 1", "inputs": [], "why": "", "id": "while-7", "a": "1\n2\n3"}, {"t": "out", "q": "Что выведет программа?", "code": "n = 10\nwhile n > 0:\n    print(n)\n    n = n - 4", "inputs": [], "why": "10, 6, 2, а потом n = -2 — условие n > 0 неверно.", "id": "while-8", "a": "10\n6\n2"}, {"t": "out", "q": "Что выведет программа?", "code": "x = 1\nwhile x < 50:\n    x = x * 2\nprint(x)", "inputs": [], "why": "1 → 2 → 4 → 8 → 16 → 32 → 64. 64 уже не меньше 50.", "id": "while-9", "a": "64"}, {"t": "out", "q": "Что выведет программа?", "code": "i = 0\nwhile True:\n    i += 1\n    if i == 4:\n        break\nprint(i)", "inputs": [], "why": "", "id": "while-10", "a": "4"}, {"t": "out", "q": "Что выведет программа?", "code": "s = 0\ni = 1\nwhile i <= 4:\n    s += i\n    i += 1\nprint(s)", "inputs": [], "why": "", "id": "while-11", "a": "10"}, {"t": "out", "q": "Что выведет программа?", "code": "total = 0\nn = int(input())\nwhile n != 0:\n    total += n\n    n = int(input())\nprint(total)", "inputs": ["5", "3", "0"], "why": "", "id": "while-12", "a": "8"}, {"t": "code", "q": "Выведи числа от 1 до 5, каждое с новой строки, используя while (без for).", "sol": "i = 1\nwhile i <= 5:\n    print(i)\n    i = i + 1", "tests": [[]], "start": "", "hint": "", "need": [["\\bwhile\\b", "Используй while"]], "ban": [["\\bfor\\b", "В этой задаче — только while"]], "hide": false, "id": "while-13", "exp": ["1\n2\n3\n4\n5"]}, {"t": "code", "q": "Выведи чётные числа от 2 до 10, каждое с новой строки, используя while.", "sol": "i = 2\nwhile i <= 10:\n    print(i)\n    i = i + 2", "tests": [[]], "start": "", "hint": "", "need": [["\\bwhile\\b", "Используй while"]], "ban": [["\\bfor\\b", "В этой задаче — только while"]], "hide": false, "id": "while-14", "exp": ["2\n4\n6\n8\n10"]}, {"t": "code", "q": "Прочитай n и сделай обратный отсчёт через while: числа от n до 1, а потом «Пуск!».", "sol": "n = int(input())\nwhile n > 0:\n    print(n)\n    n = n - 1\nprint(\"Пуск!\")", "tests": [["5"], ["2"]], "start": "", "hint": "", "need": [["\\bwhile\\b", "Используй while"]], "ban": [["\\bfor\\b", "В этой задаче — только while"]], "hide": false, "id": "while-15", "exp": ["5\n4\n3\n2\n1\nПуск!", "2\n1\nПуск!"]}, {"t": "code", "q": "Читай целые числа, пока не введут 0. Потом выведи сумму всех введённых чисел.", "sol": "total = 0\nn = int(input())\nwhile n != 0:\n    total = total + n\n    n = int(input())\nprint(total)", "tests": [["5", "3", "0"], ["10", "20", "30", "0"], ["0"], ["-5", "8", "0"]], "start": "", "hint": "", "need": [["\\bwhile\\b", "Используй while"]], "ban": [], "hide": false, "id": "while-16", "exp": ["8", "60", "0", "3"]}, {"t": "code", "q": "Читай пароли, пока не введут secret. На каждый неверный выводи «Неверно, попробуй ещё». Когда введут верный — «Добро пожаловать!».", "sol": "p = input()\nwhile p != \"secret\":\n    print(\"Неверно, попробуй ещё\")\n    p = input()\nprint(\"Добро пожаловать!\")", "tests": [["abc", "123", "secret"], ["secret"], ["Secret", "secret"]], "start": "", "hint": "", "need": [["\\bwhile\\b", "Используй while"]], "ban": [], "hide": false, "id": "while-17", "exp": ["Неверно, попробуй ещё\nНеверно, попробуй ещё\nДобро пожаловать!", "Добро пожаловать!", "Неверно, попробуй ещё\nДобро пожаловать!"]}, {"t": "code", "q": "Прочитай n. Начни с числа 1 и удваивай его, пока оно меньше n. Выведи, что получилось.", "sol": "n = int(input())\nx = 1\nwhile x < n:\n    x = x * 2\nprint(x)", "tests": [["100"], ["1"], ["17"], ["64"]], "start": "", "hint": "", "need": [["\\bwhile\\b", "Используй while"]], "ban": [], "hide": false, "id": "while-18", "exp": ["128", "1", "32", "64"]}, {"t": "code", "q": "Прочитай целое положительное число и выведи, сколько в нём цифр. Используй while и // 10.", "sol": "n = int(input())\ncount = 0\nwhile n > 0:\n    n = n // 10\n    count = count + 1\nprint(count)", "tests": [["12345"], ["7"], ["100"]], "start": "", "hint": "Каждый круг отрезай последнюю цифру (n = n // 10) и прибавляй 1 к счётчику.", "need": [["\\bwhile\\b", "Используй while"]], "ban": [["len\\(", "Попробуй без len() — через while"]], "hide": false, "id": "while-19", "exp": ["5", "1", "3"]}, {"t": "code", "q": "Прочитай целое положительное число и выведи сумму его цифр.", "sol": "n = int(input())\ns = 0\nwhile n > 0:\n    s = s + n % 10\n    n = n // 10\nprint(s)", "tests": [["123"], ["9"], ["1005"], ["99999"]], "start": "", "hint": "n % 10 — последняя цифра, n // 10 — отрезать её.", "need": [["\\bwhile\\b", "Используй while"]], "ban": [], "hide": false, "id": "while-20", "exp": ["6", "9", "6", "45"]}, {"t": "code", "q": "Копилка: каждую неделю ты кладёшь 150 рублей. Прочитай цель (сколько нужно накопить) и выведи, через сколько недель накопишь.", "sol": "goal = int(input())\nmoney = 0\nweeks = 0\nwhile money < goal:\n    money = money + 150\n    weeks = weeks + 1\nprint(weeks)", "tests": [["1000"], ["150"], ["151"], ["3000"]], "start": "", "hint": "", "need": [["\\bwhile\\b", "Используй while"]], "ban": [], "hide": false, "id": "while-21", "exp": ["7", "1", "2", "20"]}, {"t": "code", "q": "Угадай число! Загадано число 7. Читай попытки: если попытка меньше — выводи «Больше», если больше — «Меньше», если угадал — «Угадал!», и игра заканчивается.", "sol": "secret = 7\nwhile True:\n    g = int(input())\n    if g < secret:\n        print(\"Больше\")\n    elif g > secret:\n        print(\"Меньше\")\n    else:\n        print(\"Угадал!\")\n        break", "tests": [["5", "9", "7"], ["7"], ["1", "2", "10", "7"]], "start": "", "hint": "while True: ... и break, когда угадал.", "need": [["\\bwhile\\b", "Используй while"]], "ban": [], "hide": false, "id": "while-22", "exp": ["Больше\nМеньше\nУгадал!", "Угадал!", "Больше\nБольше\nМеньше\nУгадал!"]}, {"t": "code", "q": "Читай целые числа, пока не введут 0 (ноль не считается). Выведи самое большое из введённых. Хотя бы одно число до нуля будет.", "sol": "n = int(input())\nbiggest = n\nwhile n != 0:\n    if n > biggest:\n        biggest = n\n    n = int(input())\nprint(biggest)", "tests": [["3", "8", "2", "0"], ["5", "0"], ["-4", "-2", "-9", "0"]], "start": "", "hint": "Запомни первое число как самое большое, потом сравнивай с ним каждое новое.", "need": [["\\bwhile\\b", "Используй while"]], "ban": [["max\\(", "Попробуй без max()"]], "hide": false, "id": "while-23", "exp": ["8", "5", "-2"]}]}, {"id": "lists", "emoji": "📋", "title": "Списки", "theory": "<h3>Много значений в одной переменной<\/h3>\n<p>Переменная — это одна коробка. А <b>список<\/b> — это шкаф с пронумерованными полками. В нём можно хранить сколько угодно значений.<\/p>\n<pre class=\"code\">fruits = [\"яблоко\", \"банан\", \"киви\"]\nnums = [5, 3, 9, 1]\nempty = []<\/pre>\n<p>Список пишем в квадратных скобках <code>[ ]<\/code>, элементы — через запятую.<\/p>\n<h3>Номера (индексы) начинаются с 0!<\/h3>\n<pre class=\"code\">fruits = [\"яблоко\", \"банан\", \"киви\"]\nprint(fruits[0])\nprint(fruits[2])\nprint(fruits[-1])<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>яблоко\nкиви\nкиви<\/pre><\/div>\n<ul><li>Первый элемент — <code>[0]<\/code>, второй — <code>[1]<\/code>…<\/li><li><code>[-1]<\/code> — последний, <code>[-2]<\/code> — предпоследний.<\/li><li>Если номера нет (например <code>fruits[5]<\/code>), будет ошибка IndexError.<\/li><\/ul>\n<h3>Полезные команды<\/h3>\n<ul><li><code>len(a)<\/code> — сколько элементов<\/li><li><code>a.append(x)<\/code> — добавить <code>x<\/code> в конец<\/li><li><code>a.remove(x)<\/code> — удалить первый такой <code>x<\/code><\/li><li><code>a[1] = 20<\/code> — заменить элемент<\/li><li><code>sum(a)<\/code>, <code>min(a)<\/code>, <code>max(a)<\/code> — сумма, минимум, максимум<\/li><li><code>a.sort()<\/code> — отсортировать по возрастанию<\/li><li><code>x in a<\/code> — есть ли <code>x<\/code> в списке (<code>True<\/code> или <code>False<\/code>)<\/li><\/ul>\n<pre class=\"code\">pets = [\"кот\"]\npets.append(\"пёс\")\npets.append(\"хомяк\")\nprint(pets)\nprint(len(pets))<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>['кот', 'пёс', 'хомяк']\n3<\/pre><\/div>\n<h3>Перебор списка циклом<\/h3>\n<pre class=\"code\">nums = [4, 8, 15]\nfor n in nums:\n    print(n * 2)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>8\n16\n30<\/pre><\/div>\n<p>Если нужен и номер, и значение:<\/p>\n<pre class=\"code\">colors = [\"red\", \"green\"]\nfor i in range(len(colors)):\n    print(i, colors[i])<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>0 red\n1 green<\/pre><\/div>\n<h3>Собираем список в цикле<\/h3>\n<p>Начинаем с пустого списка и добавляем через <code>append<\/code>:<\/p>\n<pre class=\"code\">squares = []\nfor i in range(1, 6):\n    squares.append(i * i)\nprint(squares)<\/pre>\n<div class=\"outblock\"><span class=\"lbl\">На экране:<\/span><pre>[1, 4, 9, 16, 25]<\/pre><\/div>\n<h3>Проверка «есть ли в списке»<\/h3>\n<pre class=\"code\">shop = [\"хлеб\", \"молоко\"]\nif \"молоко\" in shop:\n    print(\"Не забудь молоко!\")<\/pre>", "tasks": [{"t": "quiz", "q": "С какого номера начинается нумерация элементов в списке?", "opts": ["0", "1", "- const RUNNER = `
import sys, io, json, traceback
def __run_user(code, inputs_json, echo, limit):
    q = list(json.loads(inputs_json))
    out = io.StringIO()
    def _input(prompt=''):
        if echo and prompt:
            out.write(str(prompt))
        if not q:
            raise EOFError('NOINPUT')
        v = q.pop(0)
        if echo:
            out.write(v + '\\n')
        return v
    steps = [0]
    FN = '<твой код>'
    def tracer(frame, event, arg):
        if frame.f_code.co_filename != FN:
            return None
        if event == 'line':
            steps[0] += 1
            if steps[0] > limit:
                raise RuntimeError('TOOLONG')
        return tracer
    g = {'__name__': '__main__', 'input': _input}
    old = sys.stdout
    sys.stdout = out
    err = None
    try:
        c = compile(code, FN, 'exec')
        sys.settrace(tracer)
        try:
            exec(c, g)
        finally:
            sys.settrace(None)
    except SyntaxError as e:
        err = {'type': type(e).__name__, 'msg': str(e.msg), 'line': e.lineno}
    except BaseException as e:
        line = None
        for fr in traceback.extract_tb(e.__traceback__):
            if fr.filename == FN:
                line = fr.lineno
        err = {'type': type(e).__name__, 'msg': str(e), 'line': line}
    finally:
        sys.stdout = old
    return json.dumps({'out': out.getvalue(), 'err': err, 'left': len(q)})
`;
let pyPromise = null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("script")); document.head.appendChild(s); }); }
function getPy(){
  if (!pyPromise){
    pyPromise = (async()=>{
      await loadScript(PYO + "pyodide.js");
      const py = await loadPyodide({indexURL: PYO});
      py.runPython(RUNNER);
      return py;
    })();
    pyPromise.catch(()=>{ pyPromise = null; });
  }
  return pyPromise;
}
async function runPy(code, inputs, echo){
  const py = await getPy();
  const fn = py.globals.get("__run_user");
  const r = JSON.parse(fn(code, JSON.stringify(inputs||[]), !!echo, 300000));
  fn.destroy && fn.destroy();
  return r;
}
function explainErr(e){
  const at = e.line ? ` (строка ${e.line})` : "";
  const m = e.msg || "";
  const T = {
    SyntaxError: "Ошибка в записи кода. Проверь кавычки, скобки и двоеточие после if / for / while / else.",
    IndentationError: "Ошибка с отступами. Команды внутри if / for / while нужно сдвигать на 4 пробела, а остальные — нет.",
    TabError: "Перепутаны пробелы и Tab в отступах. Используй что-то одно.",
    NameError: "Python не знает такого имени. Может, опечатка? Забыл кавычки у текста? Или переменная ещё не создана?",
    TypeError: "Смешаны разные типы. Например, нельзя сложить строку и число. Может, забыл int()?",
    ValueError: "Неподходящее значение. Например, int() получил не число.",
    ZeroDivisionError: "Делить на ноль нельзя!",
    IndexError: "Такого номера в списке нет. Помни: нумерация начинается с 0, а последний номер — len(список) - 1.",
    AttributeError: "У этого значения нет такой команды. Проверь, правильно ли написано название (например, append).",
    KeyboardInterrupt: "Программа остановлена."
  };
  if (e.type === "EOFError" && m === "NOINPUT") return "Программа просит ввести ещё данные, а их больше нет. Может, лишний input()?" + at;
  if (e.type === "RuntimeError" && m === "TOOLONG") return "Программа работает слишком долго. Похоже на бесконечный цикл: проверь, меняется ли переменная из условия while." + at;
  return (T[e.type] || "Ошибка при выполнении.") + at + `\n${e.type}: ${m}`;
}
function norm(s){
  let L = String(s).replace(/\r/g,"").split("\n").map(x=>x.replace(/\s+$/,""));
  while (L.length && !L[L.length-1]) L.pop();
  while (L.length && !L[0]) L.shift();
  return L.join("\n").replace(/ё/g,"е").replace(/Ё/g,"Е");
}
const loose = s => norm(s).split("\n").map(x=>x.trim().replace(/\s+/g," ")).join("\n");

// ---------- editor ----------
function editor(ta, onRun){
  const ins = t => { ta.focus(); if (!document.execCommand("insertText", false, t)) ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, "end"); };
  ta.addEventListener("keydown", e=>{
    if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); onRun&&onRun(); return; }
    if (e.key==="Tab"){
      e.preventDefault();
      if (e.shiftKey){
        const v=ta.value, s=ta.selectionStart, ls=v.lastIndexOf("\n", s-1)+1;
        const m=v.slice(ls).match(/^ {1,4}/);
        if (m){ ta.setSelectionRange(ls, ls+m[0].length); ins(""); }
      } else ins("    ");
    }
    if (e.key==="Enter" && !e.shiftKey){
      const v=ta.value, s=ta.selectionStart, ls=v.lastIndexOf("\n", s-1)+1, line=v.slice(ls, s);
      let ind=(line.match(/^ */)||[""])[0];
      if (/:\s*$/.test(line)) ind+="    ";
      e.preventDefault(); ins("\n"+ind);
    }
    if (e.key==="Backspace" && ta.selectionStart===ta.selectionEnd){
      const v=ta.value, s=ta.selectionStart, ls=v.lastIndexOf("\n", s-1)+1, before=v.slice(ls,s);
      if (before.length>=4 && /^ +$/.test(before) && before.length%4===0){ e.preventDefault(); ta.setSelectionRange(s-4,s); ins(""); }
    }
  });
}

}
const PRAISE=["Отлично! 🎉","Верно! 💪","Так держать! 🚀","Супер! ⭐","Правильно! 👍","Молодец! 🔥","Точно в цель! 🎯"];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
function fb(kind, html){ const f=$("#fb"); f.className="fb show "+kind; f.innerHTML=html; }

function renderQuiz(task, el){
  el.innerHTML = `<div class="q">${codeQ(task.q)}</div>
    <div class="opts">${task.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${"АБВГД"[j]}</span><span class="mono" style="font-family:inherit">${esc(o)}</span></button>`).join("")}</div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j;
    el.querySelectorAll(".opt").forEach(x=>x.classList.remove("ok","bad","sel"));
    if (j===task.a){
      b.classList.add("ok"); markDone(task);
      fb("ok", `<h4>${praise()}</h4>${esc(task.why||"")}`);
    } else {
      b.classList.add("bad");
      fb("bad", `<h4>Не совсем 🤔</h4>Подумай ещё и попробуй другой вариант.`);
    }
  });
}

function inputsHtml(inp){
  if (!inp || !inp.length) return "";
  return `<div class="inputs"><b>Пользователь вводит</b> (по очереди): ${inp.map(x=>`<span class="mono">${esc(x)}</span>`).join(" ")}</div>`;
}

function renderOut(task, el){
  el.innerHTML = `<div class="q">${esc(task.q)}</div>
    <pre class="code">${esc(task.code)}</pre>
    ${inputsHtml(task.inputs)}
    <label class="fl">Твой ответ — напиши точно так, как будет на экране (каждую строку — с новой строки):</label>
    <textarea class="ans mono" id="ans" spellcheck="false" rows="${Math.max(2, task.a.split("\n").length+1)}"></textarea>
    <div class="actions"><button class="btn" id="chk">Проверить</button><button class="btn ghost" id="show" style="display:none">Показать ответ</button></div>`;
  let tries=0;
  $("#chk").onclick=()=>{
    const v=$("#ans").value;
    if (!v.trim()){ fb("info","Сначала напиши ответ 🙂"); return; }
    if (loose(v)===loose(task.a)){
      markDone(task); fb("ok", `<h4>${praise()}</h4>${esc(task.why||"")}`);
    } else {
      tries++;
      fb("bad", `<h4>Пока не то 🤔</h4>Пройди по программе строчка за строчкой, как компьютер: что лежит в переменных и что печатает каждый print?`+(task.why&&tries>=2?`<br><b>Подсказка:</b> ${esc(task.why)}`:""));
      if (tries>=2) $("#show").style.display="";
    }
  };
  $("#show").onclick=()=>fb("info", `<b>Правильный ответ:</b><pre>${esc(task.a)}</pre>${esc(task.why||"")}<br>Попробуй понять, почему так, и введи его сам.`);
}

function renderCode(task, el){
  const ex = task.hide ? "" : (()=>{
    const inp=task.tests[0], out=task.exp[0];
    if (!inp.length) return `<div class="example"><div style="grid-column:1/-1"><span class="lbl">На экране должно быть:</span><pre>${esc(out)}</pre></div></div>`;
    let h="";
    for (let j=0;j<Math.min(2,task.tests.length);j++)
      h+=`<div class="example"><div><span class="lbl">Пример ${j+1}: ввод</span><pre>${esc(task.tests[j].join("\n"))}</pre></div><div><span class="lbl">вывод</span><pre>${esc(task.exp[j])}</pre></div></div>`;
    return h;
  })();
  const saved = P.code[task.id];
  el.innerHTML = `<div class="q">${esc(task.q)}</div>${ex}
    <label class="fl">Твой код: (Tab — отступ, Ctrl+Enter — проверить)</label>
    <textarea class="ed" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(saved!=null?saved:(task.start?task.start+"\n":""))}</textarea>
    <div class="actions">
      <button class="btn green" id="chk">▶ Проверить</button>
      <button class="btn ghost" id="hintB">💡 Подсказка</button>
      <button class="btn ghost" id="solB" style="display:none">Показать решение</button>
      <span class="status" id="st"></span>
    </div>
    <div class="hint" id="hint"></div>
    <div class="sol" id="sol"><label class="fl">Одно из решений:</label><pre class="code">${esc(task.sol)}</pre></div>`;
  const ed=$("#ed");
  ed.addEventListener("input", ()=>{ P.code[task.id]=ed.value; save(); });
  const tries=()=>P.tries[task.id]||0;
  if (tries()>=2 || P.done[task.id]) $("#solB").style.display="";
  $("#hintB").onclick=()=>{ const h=$("#hint"); h.classList.add("show");
    h.innerHTML = task.hint ? "💡 "+esc(task.hint) : "💡 Перечитай объяснение темы — там есть похожий пример. Двигайся маленькими шагами и проверяй.";
  };
  $("#solB").onclick=()=>$("#sol").classList.toggle("show");
  const check=async()=>{
    const code=ed.value;
    if (!code.trim()){ fb("info","Сначала напиши код 🙂"); return; }
    for (const [rx,msg] of task.need) if (!new RegExp(rx).test(code)){ fb("bad",`<h4>Почти!</h4>${esc(msg)}.`); return; }
    for (const [rx,msg] of task.ban) if (new RegExp(rx).test(code)){ fb("bad",`<h4>Условие задачи</h4>${esc(msg)}.`); return; }
    const btn=$("#chk"); btn.disabled=true;
    $("#st").textContent = pyPromise ? "Проверяю…" : "Запускаю Python (первый раз — несколько секунд)…";
    try{
      let failed=null;
      for (let j=0;j<task.tests.length;j++){
        const r=await runPy(code, task.tests[j], false);
        if (r.err){ failed={j, err:r.err, out:r.out}; break; }
        if (norm(r.out)!==norm(task.exp[j])){ failed={j, out:r.out}; break; }
      }
      if (!failed){
        markDone(task);
        fb("ok", `<h4>${praise()}</h4>Все проверки пройдены: ${task.tests.length} из ${task.tests.length}.`);
        $("#solB").style.display="";
      } else {
        P.tries[task.id]=tries()+1; save();
        if (tries()>=2) $("#solB").style.display="";
        const inp=task.tests[failed.j];
        const inpH = inp.length ? `<div class="lbl">Ввод:</div><pre>${esc(inp.join("\n"))}</pre>` : "";
        if (failed.err){
          fb("bad", `<h4>Ошибка в программе 🐞</h4>${esc(explainErr(failed.err)).replace(/\n/g,"<br>")}${inpH}${failed.out?`<div class="lbl">Успело напечататься:</div><pre>${esc(failed.out)}</pre>`:""}`);
        } else {
          fb("bad", `<h4>Ответ не совпал (проверка ${failed.j+1} из ${task.tests.length})</h4>${inpH}
            <div class="cols"><div><div class="lbl">Нужно:</div><pre>${esc(task.exp[failed.j])}</pre></div>
            <div><div class="lbl">У тебя получилось:</div><pre>${esc(failed.out||"(пусто)")}</pre></div></div>
            Сравни внимательно: пробелы, знаки препинания, большие и маленькие буквы.`);
        }
      }
    } catch(e){
      fb("bad", `<h4>Не получилось запустить Python</h4>Проверь интернет и попробуй ещё раз. Python загружается из интернета при первой проверке.`);
    }
    btn.disabled=false; $("#st").textContent="";
  };
  $("#chk").onclick=check;
  editor(ed, check);
  getPy().catch(()=>{}); // preload
}

let SBX = {code:'name = input("Как тебя зовут? ")\nprint("Привет,", name)\n\nfor i in range(3):\n    print(i)\n', inp:"Макс"};
try { const s=localStorage.getItem(KEY+"_sbx"); if (s) SBX=JSON.parse(s); } catch(e) {}
function renderSandbox(){
  const app=$("#app");
  app.innerHTML = `<button class="back" id="bk">← Все темы</button>
  <h1>🧪 Песочница</h1>
  <p class="sub">Здесь можно писать любой код и смотреть, что получится. Ничего не проверяется: просто экспериментируй!</p>
  <div class="panel">
    <label class="fl">Код (Ctrl+Enter — запустить):</label>
    <textarea class="ed" id="ed" spellcheck="false" style="min-height:260px">${esc(SBX.code)}</textarea>
    <label class="fl">Что вводит пользователь — каждое значение с новой строки (для input):</label>
    <textarea class="ans" id="inp" spellcheck="false" style="min-height:60px">${esc(SBX.inp)}</textarea>
    <div class="actions"><button class="btn green" id="run">▶ Запустить</button><button class="btn ghost" id="clr">Очистить код</button><span class="status" id="st"></span></div>
    <label class="fl">На экране:</label>
    <div class="sbx-out" id="out"></div>
  </div>`;
  $("#bk").onclick=()=>go({name:"home"});
  const ed=$("#ed"), inp=$("#inp");
  const sv=()=>{ SBX={code:ed.value, inp:inp.value}; try{localStorage.setItem(KEY+"_sbx", JSON.stringify(SBX));}catch(e){} };
  ed.addEventListener("input", sv); inp.addEventListener("input", sv);
  $("#clr").onclick=()=>{ ed.value=""; sv(); ed.focus(); };
  const run=async()=>{
    const b=$("#run"); b.disabled=true;
    $("#st").textContent = pyPromise ? "Выполняю…" : "Запускаю Python (первый раз — несколько секунд)…";
    try{
      const lines = inp.value.replace(/\r/g,"").split("\n"); if (lines.length && lines[lines.length-1]==="") lines.pop();
      const r=await runPy(ed.value, lines, true);
      $("#out").innerHTML = esc(r.out) + (r.err?`<span class="err">${r.out&&!r.out.endsWith("\n")?"\n":""}${esc(explainErr(r.err))}</span>`:"") || "<span style='opacity:.5'>(программа ничего не напечатала)</span>";
    } catch(e){ $("#out").innerHTML = `<span class="err">Не получилось загрузить Python. Проверь интернет.</span>`; }
    b.disabled=false; $("#st").textContent="";
  };
  $("#run").onclick=run;
  editor(ed, run);
  getPy().catch(()=>{});
}

// ---------- confetti ----------
function confetti(n){
  const c=$("#conf"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#3572c6","#ffd43b","#22a35a","#ff6b6b","#a66bff"];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*0.35,vx:(Math.random()-.5)*12,vy:-Math.random()*10-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let f=0;
  (function step(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.a+=0.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if (++f<90) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height);
  })();
}
